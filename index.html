<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYMSESH | Training Tracker</title><style>:root{font-family:system-ui;background:#0e1420;color:#f5f6f8;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;background:#182334}h1{margin:0;font-size:28px}nav{display:flex;gap:8px;padding:14px 5%;overflow:auto;background:#182334}button{cursor:pointer;background:#28384b;color:white;border:1px solid #46566a;border-radius:9px;padding:10px 14px}button.on,.primary{background:#e9b450;color:#17202b;font-weight:700}main{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#192535;border:1px solid #334154;padding:20px;border-radius:14px;margin-bottom:14px}small,.muted{color:#aab8cb}h2{margin:0 0 20px}h3{margin:5px 0 12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #344256;padding:10px 5px;text-align:left}th{color:#b9c7da;font-size:13px}input,select{display:block;width:100%;padding:12px;background:#101a29;border:1px solid #44546a;border-radius:8px;color:white;margin:5px 0 14px}label{font-size:13px;color:#b9c7da}.row{display:flex;gap:10px;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #354459}.item:last-child{border:0}.item button{float:right}.notice{font-size:13px;color:#eacb8a}a{color:#e9b450}@media(max-width:600px){h1{font-size:23px}nav button{white-space:nowrap}td,th{font-size:12px}}</style><header><h1>GYM<span style="color:#e9b450">SESH</span></h1><small>Strength • endurance • mobility • progress</small></header><nav id="nav"></nav><main id="app"></main><script>
const plan=[{name:'Strength & Muscle Mass',time:'75–85 min',ex:[['Barbell back squat','3 × 6–8'],['Bench press','3 × 6–10'],['Lat pulldown','3 × 8–12'],['Romanian deadlift','3 × 8–10'],['Seated cable row','2 × 10–12'],['Biceps curl','2 × 10–15'],['Triceps pushdown','2 × 10–15'],['Pallof press','2 × 10/side']]},{name:'Rotation, Mobility & Arm Health',time:'70–85 min',ex:[['Medicine ball rotational throw','3 × 5/side'],['Bulgarian split squat','3 × 8/leg'],['Landmine press','3 × 8–10/arm'],['Chest-supported row','3 × 10–12'],['Cable woodchop','3 × 10/side'],['Shoulder external rotation','2 × 12–15/arm'],['Forearm pronation/supination','2 × 12–15/arm'],['Wrist flexion','2 × 12–15/arm'],['Stationary bike','10–12 min']]},{name:'Hypertrophy & Athletic Endurance',time:'75–90 min',ex:[['Trap-bar deadlift','3 × 5–8'],['Incline dumbbell press','3 × 8–12'],['Leg press','3 × 10–12'],['Pull-up / pulldown','3 × 8–12'],['Lateral raise','2 × 12–15'],['Face pull','2 × 12–15'],['Hammer curl','2 × 10–12'],['Cable crunch','2 × 12–15'],['Side plank','2 × 30–45 sec/side'],['Cardio','8–10 min']]}];
const initial=[['Chest press',85],['Leg curl',70],['Lat pulldown',110],['Seated cable row',110],['Triceps pushdown',35]];
const KEY='gymsesh-data-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.logs))db={logs:[],weights:[]};for(let i=0;i<initial.length;i++){let [exercise,weight]=initial[i];if(!db.logs.some(l=>l.id==='seed'+i))db.logs.push({id:'seed'+i,date:'2026-11-16',exercise,weight,reps:'not recorded',day:0})}let tab='overview',day=0;const $=id=>document.getElementById(id),date=()=>new Date().toLocaleDateString('en-CA'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},link=(t,n)=>'<button class="'+(tab===n?'on':'')+'" onclick="tab=\''+n+'\';render()">'+t+'</button>';localStorage.setItem(KEY,JSON.stringify(db));
function history(){return '<div style="overflow:auto"><table><tr><th>Date</th><th>Exercise</th><th>Weight</th><th>Reps</th></tr>'+db.logs.slice().reverse().map(l=>'<tr><td>'+esc(l.date)+'</td><td>'+esc(l.exercise)+'</td><td>'+esc(l.weight)+' lb</td><td>'+esc(l.reps)+'</td></tr>').join('')+'</table></div>'}
function render(){$('nav').innerHTML=link('Overview','overview')+link('Schedule','schedule')+link('Workout','workout')+link('Log Set','log')+link('Targets','targets')+link('Progress','progress')+link('Settings','settings');let h='';
if(tab==='overview')h='<h2>Training overview</h2><div class="grid"><div class="card"><small>Training plan</small><h3>3 days / week</h3></div><div class="card"><small>Recorded working sets / entries</small><h3>'+db.logs.length+'</h3></div><div class="card"><small>Warm-up run</small><h3>2 mi · 14:50</h3><small>7:25 / mile</small></div></div><div class="card"><h3>Recorded starting lifts</h3>'+history()+'</div>';
if(tab==='schedule'){let items=[['Monday',0],['Tuesday',null],['Wednesday',1],['Thursday',null],['Friday',2],['Saturday',null],['Sunday',null]];h='<h2>Weekly schedule</h2><div class="grid">'+items.map(([name,d])=>'<div class="card"><small>'+name+'</small><h3>'+(d===null?({Tuesday:'Recovery / optional sport',Thursday:'Recovery / optional sport',Saturday:'Optional cardio / sport',Sunday:'Rest'}[name]):plan[d].name)+'</h3><p class="muted">'+(d===null?'Flexible recovery':plan[d].time)+'</p>'+(d!==null?'<button class="primary" onclick="day='+d+';tab=\'workout\';render()">View workout</button>':'')+'</div>').join('')+'</div>'}
if(tab==='workout')h='<h2>Workout plan</h2><div class="row">'+plan.map((p,i)=>'<button class="'+(day===i?'primary':'')+'" onclick="day='+i+';render()">Day '+(i+1)+'</button>').join('')+'</div><div class="card" style="margin-top:15px"><h3>'+plan[day].name+'</h3><p class="muted">'+plan[day].time+' · warm up 5–10 minutes</p>'+plan[day].ex.map(([e,r])=>'<div class="item"><button onclick="window.choice='+JSON.stringify(e).replace(/"/g,'&quot;')+';tab=\'log\';render()">Log</button><b>'+e+'</b><br><small>'+r+'</small></div>').join('')+'</div><p class="notice">Use pain-free technique. Elbow symptoms or instability warrant a sports-medicine evaluation.</p>';
if(tab==='log'){let names=[...new Set([...plan.flatMap(p=>p.ex.map(e=>e[0])),...initial.map(x=>x[0])])];h='<h2>Log a set</h2><div class="card"><form id="entry"><label>Date<input type="date" name="date" value="'+date()+'" required></label><label>Exercise<select name="exercise">'+names.map(n=>'<option '+(window.choice===n?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label><label>Weight (lb)<input name="weight" type="number" min="0" step=".5" required></label><label>Reps<input name="reps" type="number" min="1" required></label><label>Training day<select name="day">'+plan.map((p,i)=>'<option value="'+i+'" '+(day===i?'selected':'')+'>Day '+(i+1)+'</option>').join('')+'</select></label><button class="primary">Save set</button></form></div>'; }
if(tab==='targets'){let t=[['Chest press',85,95],['Leg curl',70,80],['Lat pulldown',110,120],['Seated cable row',110,120],['Triceps pushdown',35,40]];h='<h2>Strength targets</h2><div class="card"><h3>Personal next milestones</h3><p class="muted">These are incremental goals, not universal standards. Machine resistance varies.</p><table><tr><th>Exercise</th><th>Starting</th><th>Next target</th></tr>'+t.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+' lb</td><td><b>'+x[2]+' lb</b></td></tr>').join('')+'</table></div><div class="card"><h3>Bodyweight-adjusted barbell 1RM reference</h3><p class="muted">Approximate male strength benchmarks at 145 lb bodyweight. One-rep maximums, not workout prescriptions.</p><table><tr><th>Lift</th><th>Beginner</th><th>Novice</th><th>Intermediate</th></tr><tr><td>Barbell bench</td><td>94 lb</td><td>131 lb</td><td>177 lb</td></tr><tr><td>Barbell squat</td><td>126 lb</td><td>176 lb</td><td>238 lb</td></tr></table><p><a href="https://strengthlevel.com/strength-standards/male">Strength Level standards</a></p><p class="muted">Increase weight only after reaching the upper rep range with controlled form and 1–3 reps in reserve.</p></div>'}
if(tab==='progress')h='<h2>Progress history</h2><div class="card"><h3>Logged lifts</h3>'+history()+'</div><div class="card"><h3>Body weight</h3><form id="weigh"><label>Date<input type="date" name="date" value="'+date()+'" required></label><label>Weight (lb)<input type="number" name="weight" min="1" step=".1" required></label><button class="primary">Record weight</button></form><p class="muted">'+db.weights.map(x=>esc(x.date)+': '+esc(x.weight)+' lb').join(' · ')+'</p></div>';
if(tab==='settings')h='<h2>Data settings</h2><div class="card"><p>New entries are stored in this browser only. They do not automatically sync to GitHub or other devices. Export backups regularly.</p><button class="primary" onclick="let a=document.createElement(\'a\'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:\'application/json\'}));a.href=u;a.download=\'gymsesh-backup.json\';a.click();URL.revokeObjectURL(u)">Export JSON backup</button></div>';
$('app').innerHTML=h;let f=$('entry');if(f)f.onsubmit=e=>{e.preventDefault();db.logs.push({...Object.fromEntries(new FormData(f)),id:'set'+Date.now()});save()};let w=$('weigh');if(w)w.onsubmit=e=>{e.preventDefault();db.weights.push(Object.fromEntries(new FormData(w)));save()}}
render();</script></html>
