ialog').close()">×</button><h2 id="exercise-dialog-title"></h2><h3>How to perform</h3><p id="exercise-how"></p><h3>Muscles worked</h3><p id="exercise-muscles"></p></dialog><script>
const plan=[
{name:'Strength & Muscle Mass',time:'75–85 min',ex:[['Barbell back squat','3 × 6–8'],['Bench press','3 × 6–10'],['Lat pulldown','3 × 8–12'],['Seated cable row','2 × 10–12'],['Biceps curl','2 × 10–15'],['Standing calf raises','3 × 12–15'],['Pallof press','2 × 10/side']]},
{name:'Rotation, Mobility & Arm Health',time:'65–80 min',ex:[['Rotary torso machine','3 × 10–12/side'],['Seated leg curl','3 × 10–12'],['Overhead press machine','3 × 8–10'],['Reverse pec deck','3 × 12–15'],['Horizontal cable woodchop','3 × 10/side'],['Triceps pushdown','2 × 10–15'],['Stationary bike','10–12 min']]},
{name:'Home Strength & Hypertrophy',time:'55–70 min',ex:[['Dumbbell glute bridge','3 × 12–15'],['Single-arm dumbbell row','3 × 10–12/arm'],['Bulgarian split squat','3 × 8–12/leg'],['Dumbbell lateral raise','2 × 12–15'],['Hammer curl','2 × 10–15'],['Shoulder external rotation','2 × 12–15/arm'],['Wrist flexion','2 × 12–15/arm'],['Push-ups','2 × 8–15'],['Side plank','2 × 30–45 sec/side']]}];

[['Leg swings','10 each leg, front/back'],['Bodyweight squats','10 controlled reps'],['Hip hinges','10 reps'],['Arm circles','10 each direction'],['Band pull-aparts','12–15 reps']],
[['Torso rotations','10 each side, controlled'],['World’s greatest stretch','5 each side, flowing'],['Shoulder circles','10 each direction'],['Forearm pronation / supination','12 each side, light and controlled'],['Wrist flexor / extensor mobility','10 gentle reps each']],
[['Leg swings','10 each leg'],['Bodyweight squats','10 controlled reps'],['Hip hinges','10 reps'],['Arm circles','10 each direction'],['Scapular wall slides','10 reps']]
];
const exerciseInfo={"Dumbbell glute bridge":["Lie on your back with knees bent and feet flat about hip-width apart. Secure one dumbbell across your hips, brace your core, then drive through your heels to lift your hips until shoulders, hips and knees form a line. Lower slowly without over-arching your back.","Gluteus maximus primarily, with hamstrings and core stabilizers assisting."],"Reverse pec deck":["Adjust the seat so the handles are near shoulder height. With a soft bend in your elbows, open your arms out and back, squeeze your shoulder blades gently, then return slowly.","Rear deltoids, rhomboids and middle trapezius."],"45° back extension":["Position the pad just below your hip crease and secure your feet. Hinge forward at your hips with a neutral back, then raise your torso until aligned with your legs; avoid arching beyond neutral.","Glutes, hamstrings and spinal erectors."],"Overhead press machine":["Adjust the seat so the handles begin near shoulder height. Keep your back supported and ribs down, press upward smoothly, then lower with control.","Deltoids, triceps and upper chest."],"Pec deck chest fly":["Adjust the seat so the handles or pads align around chest height. Keep elbows softly bent, bring arms together in front of your chest, then return slowly without overstretching your shoulders.","Pectoralis major (chest), with front deltoids assisting."],"Standing calf raises":["Stand tall with feet hip-width apart. Rise onto the balls of your feet, pause briefly, then lower your heels slowly through a comfortable range.","Calves, especially gastrocnemius and soleus."],"Barbell back squat":["Set the bar securely across your upper back, brace your core, sit down between your hips, then drive through your feet to stand.","Quadriceps, glutes, adductors; core stabilizers."],"Bench press":["Lie on the bench with feet planted. Lower the bar under control toward your mid-chest, then press upward. Use safeties or a spotter.","Chest, triceps, front shoulders."],"Lat pulldown":["Sit tall, secure your thighs, pull the bar toward your upper chest while bringing elbows down, then return slowly.","Lats, upper back, biceps."],"Seated leg curl":["Adjust the machine to align your knees with its pivot. Curl your heels down and back, pause, and return slowly.","Hamstrings."],"Seated cable row":["Sit tall with a neutral spine. Pull the handle toward your lower ribs, squeezing shoulder blades together; extend arms with control.","Mid-back, lats, rear shoulders, biceps."],"Biceps curl":["Keep elbows near your sides. Curl the weight upward without swinging, then lower slowly.","Biceps and brachialis."],"Triceps pushdown":["Keep upper arms close to your torso. Straighten your elbows to press the cable handle down, then return with control.","Triceps."],"Pallof press":["Stand sideways to a cable or band anchor at chest height. Press the handle straight out without letting your torso twist.","Obliques, transverse abdominis and other core stabilizers."],"Rotary torso machine":["Adjust the seat and pads, brace your trunk, then rotate through a comfortable range without jerking or forcing your lower back.","Obliques and rotational trunk muscles."],"Bulgarian split squat":["Place your rear foot on a bench, front foot far enough forward for balance. Lower your hips vertically, then push through the front foot.","Quadriceps, glutes and hip stabilizers."],"Dumbbell overhead press":["Start with dumbbells near shoulder height, brace your ribs and core, press overhead, then lower with control.","Shoulders, triceps and upper chest."],"Single-arm dumbbell row":["Support one hand and knee on a bench. Keep your back level and pull the dumbbell toward your hip without twisting.","Lats, mid-back, rear shoulders and biceps."],"Horizontal cable woodchop":["Set the cable around chest height. Stand sideways, brace, and rotate hips and torso together to move the handle horizontally; control the return.","Obliques, abdominal muscles, glutes and hip rotators."],"Shoulder external rotation":["Keep your elbow tucked near your side at about 90 degrees. Rotate your forearm outward against light resistance without moving your torso.","Rotator cuff, especially infraspinatus and teres minor."],"Wrist flexion":["Rest your forearm on your thigh or bench, palm up. Curl your wrist upward through a comfortable range, then lower slowly.","Forearm wrist flexors."],"Stationary bike":["Adjust the seat so your knee stays slightly bent at the bottom of the pedal stroke. Pedal smoothly at a sustainable resistance and record minutes and level.","Quadriceps, glutes, calves and cardiovascular system."],"Goblet squat":["Hold one dumbbell vertically at your chest. Brace, squat between your knees, then stand tall through your whole foot.","Quadriceps, glutes and core."],"Dumbbell bench press":["Lie on your bench with feet planted. Lower dumbbells beside your chest with control and press them upward without banging them together.","Chest, triceps and front shoulders."],"Dumbbell Romanian deadlift":["Hold dumbbells in front of your thighs. Keep knees softly bent, push hips back with a neutral spine, then stand by driving hips forward.","Hamstrings, glutes and spinal erectors."],"Dumbbell lateral raise":["With a slight elbow bend, raise light dumbbells out to your sides to roughly shoulder height; lower without swinging.","Side deltoids, with upper traps assisting."],"Hammer curl":["Hold dumbbells with palms facing inward. Curl without swinging or moving your upper arms, then lower slowly.","Brachialis, brachioradialis and biceps."],"Push-ups":["Place hands slightly wider than shoulders, keep a straight line from head to heels, lower chest toward floor, then press away.","Chest, triceps, front shoulders and core."],"Side plank":["Support yourself on one forearm with elbow under shoulder. Lift hips and maintain a straight line without rolling forward.","Obliques, deep core and lateral hip stabilizers."]};
function showExerciseInfo(name){const info=exerciseInfo[name];if(!info)return;const modal=document.getElementById('exercise-dialog');document.getElementById('exercise-dialog-title').textContent=name;document.getElementById('exercise-how').textContent=info[0];document.getElementById('exercise-muscles').textContent=info[1];modal.showModal()}
const SHEETS_ENDPOINT='https://script.google.com/macros/s/AKfycbzKGChAV9yj7qVWtjNLii6d3nO_YcTk8LNl93rXwsPhkv4jrcJaKm7VSlk6pJoEg1QndQ/exec';
const KEY='gymsesh-data-v2',oldKey='gymsesh-data-v1';
const seed=[['Chest press',85],['Leg curl',70],['Lat pulldown',110],['Seated cable row',110],['Triceps pushdown',35]];
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){try{const old=JSON.parse(localStorage.getItem(oldKey));db={logs:old?.logs||[],weights:old?.weights||[],sessions:{}}}catch(e){}}
if(!db)db={logs:[],weights:[],sessions:{}};
db.logs=Array.isArray(db.logs)?db.logs:[];db.weights=Array.isArray(db.weights)?db.weights:[];db.sessions=db.sessions||{};
for(let i=0;i<seed.length;i++){if(!db.logs.some(x=>x.id==='seed'+i))db.logs.push({id:'seed'+i,date:'2026-11-16',exercise:seed[i][0],weight:seed[i][1],reps:'not recorded',day:0})}
let day=0,view='today',sessionDate=new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function sessionKey(){return sessionDate+'-day'+day}
function getSession(){return db.sessions[sessionKey()]||{}}
function updateField(index,field,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key][index]=db.sessions[key][index]||{};db.sessions[key][index][field]=field==='done'?Boolean(value):value;persist();updateProgress()}
function updatePrep(i,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key].prep=db.sessions[key].prep||{};db.sessions[key].prep[i]=value;persist()}
function updateRun(field,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key][field]=value;persist()}
function updateProgress(){const session=getSession(),done=plan[day].ex.filter((x,i)=>session[i]?.done).length;const el=$('completion');if(el)el.textContent=done+' of '+plan[day].ex.length+' exercises completed'}

const iconKind=name=>/squat|split squat|leg press/i.test(name)?'squat':/deadlift|romanian/i.test(name)?'hinge':/bench|chest|incline|landmine press|overhead press|push-ups/i.test(name)?'press':/pulldown|pull-up|row/i.test(name)?'pull':/rotation|rotary torso|woodchop|pallof/i.test(name)?'rotate':/curl|wrist|pronation|supination/i.test(name)?'curl':/plank|crunch/i.test(name)?'core':/bike|cardio/i.test(name)?'cardio':'raise';
function exerciseArt(name){const k=iconKind(name),paths={
squat:'<path d="M21 26 L15 39 L24 45 L34 38 M21 26 L32 31 L40 25 M21 26 L27 18"/><path d="M11 45H45"/>',
hinge:'<path d="M29 16 L37 29 L26 37 L21 46 M37 29 L45 45 M37 29 L47 35"/><path d="M13 45H48"/>',
press:'<path d="M16 42 L38 42 M23 40 L28 27 L37 27 L41 17 M28 27 L17 19"/><path d="M12 16H45 M12 12V20 M45 12V20"/>',
pull:'<path d="M26 17 L26 33 L18 44 M26 33 L35 44 M26 19 L14 13 M26 19 L39 13"/><path d="M9 10H45 M9 6V14 M45 6V14"/>',
rotate:'<path d="M28 15V34 L19 45 M28 34 L38 45 M28 23 L15 29 M28 23 L43 18"/><path d="M11 12 Q28 1 44 12 M39 8L44 12L39 15"/>',
curl:'<path d="M27 15V34 L19 45 M27 34 L36 45 M27 21 L40 24 L40 15 M27 21 L15 30"/><path d="M34 14H46 M34 11V17 M46 11V17"/>',
core:'<path d="M11 36 L24 30 L40 30 L47 37 M24 30 L19 43 M40 30 L43 43"/><path d="M9 45H49"/>',

return '<span class="exercise-art" title="Simplified movement illustration" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none" stroke="#e9b450" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="9" r="5" fill="#e9b450" stroke="none"/>'+paths[k]+'</svg></span>'}
function render(){ $('nav').innerHTML='<button class="'+(view==='today'?'on':'')+'" onclick="switchView(\'today\')">Workout</button><button class="'+(view==='history'?'on':'')+'" onclick="switchView(\'history\')">History & targets</button><button class="'+(view==='settings'?'on':'')+'" onclick="switchView(\'settings\')">Data backup</button>';
let html='';
if(view==='today'){
const session=getSession();
html='<div class="top-select">'+plan.map((p,i)=>'<button class="'+(i===day?'primary':'')+'" onclick="selectDay('+i+')">Day '+(i+1)+'</button>').join('')+'</div><div class="card"><h3>'+plan[day].name+'</h3><div class="statbar"><span>'+plan[day].time+'</span><span class="status" id="completion"></span></div><label for="workout-date">Workout date</label><input id="workout-date" type="date" style="max-width:220px" value="'+sessionDate+'" onchange="sessionDate=this.value;render()"><div class="timebox"><strong>Expected session: '+(day===0?'75–85':day===1?'65–80':'55–70')+' minutes</strong><div class="mini">Includes your warm-up, working sets, rest and cooldown.</div></div><div class="item"><strong>Warm-up run</strong><small>Log a short run if available; on home days, substitute 5–10 minutes of brisk walking or marching.</small><div class="run-grid"><label>Distance (miles)<input type="number" min="0" step=".1" placeholder="e.g. 2" value="'+escapeHTML(session.runDistance??'')+'" onchange="updateRun(\'runDistance\',this.value)"></label><label>Time (mm:ss)<input type="text" placeholder="14:50" value="'+escapeHTML(session.runTime??'')+'" onchange="updateRun(\'runTime\',this.value)"></label><label>Completed<input type="checkbox" style="width:24px;height:24px;accent-color:#e9b450" '+(session.runDone?'checked':'')+' onchange="updateRun(\'runDone\',this.checked)"></label></div></div>';
html+='<details class="prep-panel"><summary>Before the gym · 5-minute mobility <span class="prep-arrow">⌄</span></summary><div class="prep-list">'+prep[day].map(([name,amount],i)=>'<label class="prep-row"><input type="checkbox" '+(session.prep?.[i]?'checked':'')+' onchange="updatePrep('+i+',this.checked)"><span><strong>'+escapeHTML(name)+'</strong><small>'+escapeHTML(amount)+'</small></span></label>').join('')+'</div><p class="mini">Gentle dynamic movements before your run. Avoid forcing painful ranges.</p></details>';
html+=plan[day].ex.map(([name,target],i)=>{let entry=session[i]||{};let past=db.logs.filter(l=>l.exercise.toLowerCase()===name.toLowerCase()).at(-1);return '<div class="workout-line '+(entry.done?'done':'')+'"><input aria-label="Complete '+escapeHTML(name)+'" type="checkbox" '+(entry.done?'checked':'')+' onchange="updateField('+i+',\'done\',this.checked);this.closest(\'.workout-line\').classList.toggle(\'done\',this.checked)"><div class="exercise-name">'+exerciseArt(name)+'<div class="exercise-copy"><button type="button" class="exercise-title" onclick="showExerciseInfo('+escapeHTML(JSON.stringify(name))+')" aria-label="How to perform '+escapeHTML(name)+'">'+escapeHTML(name)+' <span aria-hidden="true">ⓘ</span></button><small>Goal: '+target+(past?' · Previous: '+escapeHTML(past.weight)+' lb':'')+'</small></div></div>'+(name==='Stationary bike'? '<label>Minutes<input aria-label="Stationary bike minutes" type="number" min="0" step="1" placeholder="min" value="'+escapeHTML(entry.minutes??'')+'" onchange="updateField('+i+',\'minutes\',this.value)"></label><label>Level<input aria-label="Stationary bike level" type="number" min="0" step="1" placeholder="level" value="'+escapeHTML(entry.level??'')+'" onchange="updateField('+i+',\'level\',this.value)"></label>' : '<label>Weight (lb)<input aria-label="'+escapeHTML(name)+' weight" type="number" min="0" step=".5" placeholder="lb" value="'+escapeHTML(entry.weight??'')+'" onchange="updateField('+i+',\'weight\',this.value)"></label><label>Reps<input aria-label="'+escapeHTML(name)+' reps" type="number" min="0" step="1" placeholder="reps" value="'+escapeHTML(entry.reps??'')+'" onchange="updateField('+i+',\'reps\',this.value)"></label><label>Sets<input aria-label="'+escapeHTML(name)+' sets" type="number" min="0" step="1" placeholder="sets" value="'+escapeHTML(entry.sets??'')+'" onchange="updateField('+i+',\'sets\',this.value)"></label>')+'</div>'}).join('');

function finishWorkout(){const entries=getSession();let count=0;plan[day].ex.forEach(([exercise],i)=>{const e=entries[i];if(!e||!e.done)return;const id='session-'+sessionKey()+'-'+i;const row={id,date:sessionDate,day,exercise,weight:exercise==='Stationary bike'?(e.level||'—'):(e.weight||0),reps:exercise==='Stationary bike'?(e.minutes||'—'):(e.reps||'—'),sets:exercise==='Stationary bike'?'—':(e.sets||'—'),minutes:e.minutes||'',level:e.level||''};let idx=db.logs.findIndex(l=>l.id===id);if(idx>=0)db.logs[idx]=row;else db.logs.push(row);count++});if(entries.runDone||entries.runDistance||entries.runTime){db.runs=db.runs||[];const run={id:'run-'+sessionKey(),date:sessionDate,distance:entries.runDistance||'',time:entries.runTime||''};const ix=db.runs.findIndex(x=>x.id===run.id);if(ix>=0)db.runs[ix]=run;else db.runs.push(run)}persist();alert(count?count+' checked-off exercises saved to history.':'Run details saved. Check off exercises to save them to history.')}
async function sendToSheets(){const status=$('sheets-status');const records=[...db.logs.map(l=>({id:l.id,date:l.date,day:l.day,exercise:l.exercise,weight:l.weight,reps:l.reps,sets:l.sets})),...(db.runs||[]).map(r=>({id:r.id,date:r.date,exercise:'Warm-up run',distance:r.distance,time:r.time}))];if(!records.length){status.textContent='No saved history to send yet.';return}status.textContent='Sending '+records.length+' records…';try{await fetch(SHEETS_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',records})});status.textContent='Request sent. Google does not expose confirmation to this page. Check the GymSessions tab to verify the rows appeared.'}catch(e){status.textContent='Connection failed. Your browser data is safe; try again later.'}}
function exportBackup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='gymsesh-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
persist();render();
// Keep numeric/text entry in place, including iOS keyboard dismissal.
let editScroll=null, editField=null, editGeneration=0;
function isWorkoutInput(el){return el instanceof HTMLInputElement && el.matches('.workout-line input[type=number], .run-grid input[type=number], .run-grid input[type=text]')}
document.addEventListener('focusin',e=>{if(isWorkoutInput(e.target)){editGeneration++;editField=e.target;editScroll=window.scrollY}});
document.addEventListener('input',e=>{if(isWorkoutInput(e.target)){editField=e.target;editScroll=window.scrollY; // save without rebuilding the workout
 const handler=e.target.onchange;if(handler)handler.call(e.target,e);
}});
document.addEventListener('focusout',e=>{if(e.target!==editField||editScroll===null)return;const y=editScroll,g=++editGeneration;editField=null;editScroll=null;const restore=()=>{if(g===editGeneration&&!isWorkoutInput(document.activeElement)&&Math.abs(window.scrollY-y)>100)window.scrollTo({top:y,behavior:'instant'})};requestAnimationFrame(restore);setTimeout(restore,120);setTimeout(restore,350)});
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,summary')&&!isWorkoutInput(e.target)){editGeneration++;editField=null;editScroll=null}},true);
