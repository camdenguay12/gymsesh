<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYMSESH | Training Tracker</title><style>:root{font-family:system-ui;background:#0e1420;color:#f5f6f8;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;background:#182334}h1{margin:0;font-size:28px}nav{display:flex;gap:8px;padding:14px 5%;overflow:auto;background:#182334}button{cursor:pointer;background:#28384b;color:white;border:1px solid #46566a;border-radius:9px;padding:10px 14px}button.on,.primary{background:#e9b450;color:#17202b;font-weight:700}main{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#192535;border:1px solid #334154;padding:20px;border-radius:14px;margin-bottom:14px}small,.muted{color:#aab8cb}h2{margin:0 0 20px}h3{margin:5px 0 12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #344256;padding:10px 5px;text-align:left}th{color:#b9c7da;font-size:13px}input,select{display:block;width:100%;padding:12px;background:#101a29;border:1px solid #44546a;border-radius:8px;color:white;margin:5px 0 14px}label{font-size:13px;color:#b9c7da}.row{display:flex;gap:10px;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #354459}.item:last-child{border:0}.item button{float:right}.notice{font-size:13px;color:#eacb8a}a{color:#e9b450}@media(max-width:600px){h1{font-size:23px}nav button{white-space:nowrap}td,th{font-size:12px}}main{max-width:920px}.workout-line{display:grid;grid-template-columns:36px minmax(0,1.6fr) repeat(3,minmax(75px,1fr));align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #334154}.workout-line:last-child{border-bottom:0}.workout-line.done{opacity:.65}.workout-line input[type=checkbox]{width:23px;height:23px;accent-color:#e9b450;margin:0}.workout-line input[type=number]{margin:3px 0 0;padding:10px}.workout-line label{font-size:12px}.workout-line strong{display:block}.workout-line small{display:block;margin-top:5px}.top-select{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.top-select button{flex:1;min-width:125px}.status{color:#e9b450;font-size:13px}.mini{font-size:12px;color:#aab8cb}.statbar{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 18px}.statbar b{color:#e9b450}@media(max-width:650px){.workout-line{grid-template-columns:30px 1fr 1fr 1fr;gap:8px}.workout-line .exercise-name{grid-column:2 / -1}.workout-line label:first-of-type{grid-column:2}.workout-line input[type=number]{padding:9px 5px}.top-select button{min-width:85px}} </style><header><h1>GYM<span style="color:#e9b450">SESH</span></h1><small>Strength • endurance • mobility • progress</small></header><nav id="nav"></nav><main id="app"></main><script>
const plan=[
{name:'Strength & Muscle Mass',time:'75–85 min',ex:[['Barbell back squat','3 × 6–8'],['Bench press','3 × 6–10'],['Lat pulldown','3 × 8–12'],['Romanian deadlift','3 × 8–10'],['Seated cable row','2 × 10–12'],['Biceps curl','2 × 10–15'],['Triceps pushdown','2 × 10–15'],['Pallof press','2 × 10/side']]},
{name:'Rotation, Mobility & Arm Health',time:'70–85 min',ex:[['Medicine ball rotational throw','3 × 5/side'],['Bulgarian split squat','3 × 8/leg'],['Landmine press','3 × 8–10/arm'],['Chest-supported row','3 × 10–12'],['Cable woodchop','3 × 10/side'],['Shoulder external rotation','2 × 12–15/arm'],['Forearm pronation/supination','2 × 12–15/arm'],['Wrist flexion','2 × 12–15/arm'],['Stationary bike','10–12 min']]},
{name:'Hypertrophy & Athletic Endurance',time:'75–90 min',ex:[['Trap-bar deadlift','3 × 5–8'],['Incline dumbbell press','3 × 8–12'],['Leg press','3 × 10–12'],['Pull-up / pulldown','3 × 8–12'],['Lateral raise','2 × 12–15'],['Face pull','2 × 12–15'],['Hammer curl','2 × 10–12'],['Cable crunch','2 × 12–15'],['Side plank','2 × 30–45 sec/side'],['Cardio','8–10 min']]}];
const KEY='gymsesh-data-v2',oldKey='gymsesh-data-v1';
const seed=[['Chest press',85],['Leg curl',70],['Lat pulldown',110],['Seated cable row',110],['Triceps pushdown',35]];
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){try{const old=JSON.parse(localStorage.getItem(oldKey));db={logs:old?.logs||[],weights:old?.weights||[],sessions:{}}}catch(e){}}
if(!db)db={logs:[],weights:[],sessions:{}};
db.logs=Array.isArray(db.logs)?db.logs:[];db.weights=Array.isArray(db.weights)?db.weights:[];db.sessions=db.sessions||{};
for(let i=0;i<seed.length;i++){if(!db.logs.some(x=>x.id==='seed'+i))db.logs.push({id:'seed'+i,date:'2026-11-16',exercise:seed[i][0],weight:seed[i][1],reps:'not recorded',day:0})}
let day=0,view='today',sessionDate=new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function sessionKey(){return sessionDate+'-day'+day}
function getSession(){return db.sessions[sessionKey()]||{}}
function updateField(index,field,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key][index]=db.sessions[key][index]||{};db.sessions[key][index][field]=field==='done'?Boolean(value):value;persist();updateProgress()}
function updateProgress(){const session=getSession(),done=plan[day].ex.filter((x,i)=>session[i]?.done).length;const el=$('completion');if(el)el.textContent=done+' of '+plan[day].ex.length+' exercises completed'}
function selectDay(n){day=n;render()}
function switchView(v){view=v;render()}
function render(){ $('nav').innerHTML='<button class="'+(view==='today'?'on':'')+'" onclick="switchView(\'today\')">Workout</button><button class="'+(view==='history'?'on':'')+'" onclick="switchView(\'history\')">History & targets</button><button class="'+(view==='settings'?'on':'')+'" onclick="switchView(\'settings\')">Data backup</button>';
let html='';
if(view==='today'){
const session=getSession();
html='<h2>Today’s workout</h2><p class="muted">Select your day, then enter your working weight, repetitions and sets. Check each exercise when finished. Everything saves automatically in this browser.</p><div class="top-select">'+plan.map((p,i)=>'<button class="'+(i===day?'primary':'')+'" onclick="selectDay('+i+')">Day '+(i+1)+'</button>').join('')+'</div><div class="card"><h3>'+plan[day].name+'</h3><div class="statbar"><span>'+plan[day].time+'</span><span class="status" id="completion"></span></div><label for="workout-date">Workout date</label><input id="workout-date" type="date" style="max-width:220px" value="'+sessionDate+'" onchange="sessionDate=this.value;render()"><div class="item"><strong>Warm-up</strong><small>5–10 minutes light cardio and dynamic mobility before lifting</small></div>';
html+=plan[day].ex.map(([name,target],i)=>{let entry=session[i]||{};let past=db.logs.filter(l=>l.exercise.toLowerCase()===name.toLowerCase()).at(-1);return '<div class="workout-line '+(entry.done?'done':'')+'"><input aria-label="Complete '+escapeHTML(name)+'" type="checkbox" '+(entry.done?'checked':'')+' onchange="updateField('+i+',\'done\',this.checked);this.closest(\'.workout-line\').classList.toggle(\'done\',this.checked)"><div class="exercise-name"><strong>'+escapeHTML(name)+'</strong><small>Goal: '+target+(past?' · Previous: '+escapeHTML(past.weight)+' lb':'')+'</small></div><label>Weight (lb)<input aria-label="'+escapeHTML(name)+' weight" type="number" min="0" step=".5" placeholder="lb" value="'+escapeHTML(entry.weight??'')+'" onchange="updateField('+i+',\'weight\',this.value)"></label><label>Reps<input aria-label="'+escapeHTML(name)+' reps" type="number" min="0" step="1" placeholder="reps" value="'+escapeHTML(entry.reps??'')+'" onchange="updateField('+i+',\'reps\',this.value)"></label><label>Sets<input aria-label="'+escapeHTML(name)+' sets" type="number" min="0" step="1" placeholder="sets" value="'+escapeHTML(entry.sets??'')+'" onchange="updateField('+i+',\'sets\',this.value)"></label></div>'}).join('');
html+='</div><div class="card"><h3>Finish workout</h3><p class="muted">Your checkmarks and entries are automatically saved as you go. Press below to also archive this session in your workout history.</p><button class="primary" onclick="finishWorkout()">Save completed workout to history</button><p class="mini">If you return to this date and day, your entries remain available.</p></div><p class="notice">Keep 1–3 reps in reserve on most working sets. Avoid movements that cause elbow pain.</p>';
}else if(view==='history'){
html='<h2>History & targets</h2><div class="card"><h3>Previous workout entries</h3><div style="overflow:auto"><table><tr><th>Date</th><th>Exercise</th><th>Weight</th><th>Reps</th><th>Sets</th></tr>'+db.logs.slice().reverse().map(l=>'<tr><td>'+escapeHTML(l.date)+'</td><td>'+escapeHTML(l.exercise)+'</td><td>'+escapeHTML(l.weight)+' lb</td><td>'+escapeHTML(l.reps)+'</td><td>'+escapeHTML(l.sets||'—')+'</td></tr>').join('')+'</table></div></div><div class="card"><h3>Next weight milestones</h3><table><tr><th>Exercise</th><th>Starting</th><th>Next target</th></tr>'+[['Chest press',85,95],['Leg curl',70,80],['Lat pulldown',110,120],['Seated cable row',110,120],['Triceps pushdown',35,40]].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+' lb</td><td>'+x[2]+' lb</td></tr>').join('')+'</table><p class="muted">These are personal progression milestones, not required standards.</p></div><div class="card"><h3>Warm-up run</h3><p>2 miles · 14:50 · 7:25/mile</p></div>';
}else{
html='<h2>Data backup</h2><div class="card"><p>Your records are stored locally in this browser, not automatically synced between devices. Export a backup regularly.</p><button class="primary" onclick="exportBackup()">Download JSON backup</button><p class="mini">Do not clear browser storage without exporting your workout data.</p></div>';
}
$('app').innerHTML=html;updateProgress()}
function finishWorkout(){const entries=getSession();let count=0;plan[day].ex.forEach(([exercise],i)=>{const e=entries[i];if(!e||!e.done)return;const id='session-'+sessionKey()+'-'+i;const row={id,date:sessionDate,day,exercise,weight:e.weight||0,reps:e.reps||'—',sets:e.sets||'—'};let idx=db.logs.findIndex(l=>l.id===id);if(idx>=0)db.logs[idx]=row;else db.logs.push(row);count++});persist();alert(count?count+' checked-off exercises saved to history.':'Check off at least one exercise to save it to history.')}
function exportBackup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='gymsesh-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
persist();render();
</script></html>
