<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYMSESH | Training Tracker</title><style>:root{font-family:system-ui;background:#0e1420;color:#f5f6f8;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;background:#182334}h1{margin:0;font-size:28px}nav{display:flex;gap:8px;padding:14px 5%;overflow:auto;background:#182334}button{cursor:pointer;background:#28384b;color:white;border:1px solid #46566a;border-radius:9px;padding:10px 14px}button.on,.primary{background:#e9b450;color:#17202b;font-weight:700}main{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#192535;border:1px solid #334154;padding:20px;border-radius:14px;margin-bottom:14px}small,.muted{color:#aab8cb}h2{margin:0 0 20px}h3{margin:5px 0 12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #344256;padding:10px 5px;text-align:left}th{color:#b9c7da;font-size:13px}input,select{display:block;width:100%;padding:12px;background:#101a29;border:1px solid #44546a;border-radius:8px;color:white;margin:5px 0 14px}label{font-size:13px;color:#b9c7da}.row{display:flex;gap:10px;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #354459}.item:last-child{border:0}.item button{float:right}.notice{font-size:13px;color:#eacb8a}a{color:#e9b450}@media(max-width:600px){h1{font-size:23px}nav button{white-space:nowrap}td,th{font-size:12px}}main{max-width:920px}.workout-line{display:grid;grid-template-columns:36px minmax(0,1.6fr) repeat(3,minmax(75px,1fr));align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #334154}.workout-line:last-child{border-bottom:0}.workout-line.done{opacity:.65}.workout-line input[type=checkbox]{width:23px;height:23px;accent-color:#e9b450;margin:0}.workout-line input[type=number]{margin:3px 0 0;padding:10px}.workout-line label{font-size:12px}.workout-line strong{display:block}.workout-line small{display:block;margin-top:5px}.top-select{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.top-select button{flex:1;min-width:125px}.status{color:#e9b450;font-size:13px}.mini{font-size:12px;color:#aab8cb}.statbar{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 18px}.statbar b{color:#e9b450}@media(max-width:650px){.workout-line{grid-template-columns:30px 1fr 1fr 1fr;gap:8px}.workout-line .exercise-name{grid-column:2 / -1}.workout-line label:first-of-type{grid-column:2}.workout-line input[type=number]{padding:9px 5px}.top-select button{min-width:85px}} .exercise-name{display:flex;align-items:center;gap:10px}.exercise-name .exercise-copy{min-width:0}.exercise-art{width:58px;height:58px;flex:0 0 58px;background:#101c2c;border:1px solid #40546b;border-radius:10px;display:grid;place-items:center}.exercise-art svg{width:50px;height:50px}.run-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.run-grid input{margin:5px 0}.timebox{background:#253348;border-radius:10px;padding:12px;margin:10px 0}.timebox strong{color:#e9b450}@media(max-width:650px){.exercise-art{width:48px;height:48px;flex-basis:48px}.exercise-art svg{width:42px;height:42px}.run-grid{grid-template-columns:repeat(2,minmax(0,1fr))}} </style><header><h1>GYM<span style="color:#e9b450">SESH</span></h1><small>Strength • endurance • mobility • progress</small></header><nav id="nav"></nav><main id="app"></main><script>
const plan=[
{name:'Strength & Muscle Mass',time:'75–85 min',ex:[['Barbell back squat','3 × 6–8'],['Bench press','3 × 6–10'],['Lat pulldown','3 × 8–12'],['Romanian deadlift','3 × 8–10'],['Seated cable row','2 × 10–12'],['Biceps curl','2 × 10–15'],['Triceps pushdown','2 × 10–15'],['Pallof press','2 × 10/side']]},
{name:'Rotation, Mobility & Arm Health',time:'70–85 min',ex:[['Medicine ball rotational throw','3 × 5/side'],['Bulgarian split squat','3 × 8/leg'],['Landmine press','3 × 8–10/arm'],['Chest-supported row','3 × 10–12'],['Cable woodchop','3 × 10/side'],['Shoulder external rotation','2 × 12–15/arm'],['Forearm pronation/supination','2 × 12–15/arm'],['Wrist flexion','2 × 12–15/arm'],['Stationary bike','10–12 min']]},
{name:'Hypertrophy & Athletic Endurance',time:'75–90 min',ex:[['Trap-bar deadlift','3 × 5–8'],['Incline dumbbell press','3 × 8–12'],['Leg press','3 × 10–12'],['Pull-up / pulldown','3 × 8–12'],['Lateral raise','2 × 12–15'],['Face pull','2 × 12–15'],['Hammer curl','2 × 10–12'],['Cable crunch','2 × 12–15'],['Side plank','2 × 30–45 sec/side'],['Cardio','8–10 min']]}];
const KEY='gymsesh-data-v2',oldKey='gymsesh-data-v1';
const seed=[['Chest press',85],['Leg curl',70],['Lat pulldown',110],['Seated cable row',110],['Triceps pushdown',35]];
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){try{const old=JSON.parse(localStorage.getItem(oldKey));db={logs:old?.logs||[],weights:old?.weights||[],sessions:{}}}catch(e){}}
if(!db)db={logs:[],weights:[],sessions:{}};
db.logs=Array.isArray(db.logs)?db.logs:[];db.weights=Array.isArray(db.weights)?db.weights:[];db.sessions=db.sessions||{};
for(let i=0;i<seed.length;i++){if(!db.logs.some(x=>x.id==='seed'+i))db.logs.push({id:'seed'+i,date:'2026-11-16',exercise:seed[i][0],weight:seed[i][1],reps:'not recorded',day:0})}
let day=0,view='today',sessionDate=new Date().toLocaleDateString('en-CA');
const $=id=>document.getElementById(id),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function sessionKey(){return sessionDate+'-day'+day}
function getSession(){return db.sessions[sessionKey()]||{}}
function updateField(index,field,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key][index]=db.sessions[key][index]||{};db.sessions[key][index][field]=field==='done'?Boolean(value):value;persist();updateProgress()}
function updateRun(field,value){const key=sessionKey();db.sessions[key]=db.sessions[key]||{};db.sessions[key][field]=value;persist()}
function updateProgress(){const session=getSession(),done=plan[day].ex.filter((x,i)=>session[i]?.done).length;const el=$('completion');if(el)el.textContent=done+' of '+plan[day].ex.length+' exercises completed'}
function selectDay(n){day=n;render()}
function switchView(v){view=v;render()}

const iconKind=name=>/squat|split squat|leg press/i.test(name)?'squat':/deadlift|romanian/i.test(name)?'hinge':/bench|chest|incline|landmine press/i.test(name)?'press':/pulldown|pull-up|row/i.test(name)?'pull':/rotation|woodchop|pallof/i.test(name)?'rotate':/curl|wrist|pronation|supination/i.test(name)?'curl':/plank|crunch/i.test(name)?'core':/bike|cardio/i.test(name)?'cardio':'raise';
function exerciseArt(name){const k=iconKind(name),paths={
squat:'<path d="M21 26 L15 39 L24 45 L34 38 M21 26 L32 31 L40 25 M21 26 L27 18"/><path d="M11 45H45"/>',
hinge:'<path d="M29 16 L37 29 L26 37 L21 46 M37 29 L45 45 M37 29 L47 35"/><path d="M13 45H48"/>',
press:'<path d="M16 42 L38 42 M23 40 L28 27 L37 27 L41 17 M28 27 L17 19"/><path d="M12 16H45 M12 12V20 M45 12V20"/>',
pull:'<path d="M26 17 L26 33 L18 44 M26 33 L35 44 M26 19 L14 13 M26 19 L39 13"/><path d="M9 10H45 M9 6V14 M45 6V14"/>',
rotate:'<path d="M28 15V34 L19 45 M28 34 L38 45 M28 23 L15 29 M28 23 L43 18"/><path d="M11 12 Q28 1 44 12 M39 8L44 12L39 15"/>',
curl:'<path d="M27 15V34 L19 45 M27 34 L36 45 M27 21 L40 24 L40 15 M27 21 L15 30"/><path d="M34 14H46 M34 11V17 M46 11V17"/>',
core:'<path d="M11 36 L24 30 L40 30 L47 37 M24 30 L19 43 M40 30 L43 43"/><path d="M9 45H49"/>',
cardio:'<circle cx="17" cy="38" r="9"/><circle cx="42" cy="38" r="9"/><path d="M17 38L26 24L42 38H28L17 38 M26 24L31 18 M31 18H38"/>',
raise:'<path d="M28 14V34 L19 45 M28 34 L37 45 M28 22 L12 15 M28 22 L44 15"/><path d="M7 12H15 M40 12H48"/>'};
return '<span class="exercise-art" title="Simplified movement illustration" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none" stroke="#e9b450" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="9" r="5" fill="#e9b450" stroke="none"/>'+paths[k]+'</svg></span>'}
function render(){ $('nav').innerHTML='<button class="'+(view==='today'?'on':'')+'" onclick="switchView(\'today\')">Workout</button><button class="'+(view==='history'?'on':'')+'" onclick="switchView(\'history\')">History & targets</button><button class="'+(view==='settings'?'on':'')+'" onclick="switchView(\'settings\')">Data backup</button>';
let html='';
if(view==='today'){
const session=getSession();
html='<h2>Today’s workout</h2><p class="muted">Select your day, then enter your working weight, repetitions and sets. Check each exercise when finished. Everything saves automatically in this browser.</p><div class="top-select">'+plan.map((p,i)=>'<button class="'+(i===day?'primary':'')+'" onclick="selectDay('+i+')">Day '+(i+1)+'</button>').join('')+'</div><div class="card"><h3>'+plan[day].name+'</h3><div class="statbar"><span>'+plan[day].time+'</span><span class="status" id="completion"></span></div><label for="workout-date">Workout date</label><input id="workout-date" type="date" style="max-width:220px" value="'+sessionDate+'" onchange="sessionDate=this.value;render()"><div class="timebox"><strong>Expected session: '+(day===0?'75–85':day===1?'70–85':'75–90')+' minutes</strong><div class="mini">Includes your warm-up run, working sets, rest and cooldown.</div></div><div class="item"><strong>Warm-up run</strong><small>Start every session with a short run. Log distance and time below.</small><div class="run-grid"><label>Distance (miles)<input type="number" min="0" step=".1" placeholder="e.g. 2" value="'+escapeHTML(session.runDistance??'')+'" onchange="updateRun(\'runDistance\',this.value)"></label><label>Time (mm:ss)<input type="text" placeholder="14:50" value="'+escapeHTML(session.runTime??'')+'" onchange="updateRun(\'runTime\',this.value)"></label><label>Completed<input type="checkbox" style="width:24px;height:24px;accent-color:#e9b450" '+(session.runDone?'checked':'')+' onchange="updateRun(\'runDone\',this.checked)"></label></div></div>';
html+=plan[day].ex.map(([name,target],i)=>{let entry=session[i]||{};let past=db.logs.filter(l=>l.exercise.toLowerCase()===name.toLowerCase()).at(-1);return '<div class="workout-line '+(entry.done?'done':'')+'"><input aria-label="Complete '+escapeHTML(name)+'" type="checkbox" '+(entry.done?'checked':'')+' onchange="updateField('+i+',\'done\',this.checked);this.closest(\'.workout-line\').classList.toggle(\'done\',this.checked)"><div class="exercise-name">'+exerciseArt(name)+'<div class="exercise-copy"><strong>'+escapeHTML(name)+'</strong><small>Goal: '+target+(past?' · Previous: '+escapeHTML(past.weight)+' lb':'')+'</small></div></div><label>Weight (lb)<input aria-label="'+escapeHTML(name)+' weight" type="number" min="0" step=".5" placeholder="lb" value="'+escapeHTML(entry.weight??'')+'" onchange="updateField('+i+',\'weight\',this.value)"></label><label>Reps<input aria-label="'+escapeHTML(name)+' reps" type="number" min="0" step="1" placeholder="reps" value="'+escapeHTML(entry.reps??'')+'" onchange="updateField('+i+',\'reps\',this.value)"></label><label>Sets<input aria-label="'+escapeHTML(name)+' sets" type="number" min="0" step="1" placeholder="sets" value="'+escapeHTML(entry.sets??'')+'" onchange="updateField('+i+',\'sets\',this.value)"></label></div>'}).join('');
html+='</div><div class="card"><h3>Finish workout</h3><p class="muted">Your checkmarks and entries are automatically saved as you go. Press below to also archive this session in your workout history.</p><button class="primary" onclick="finishWorkout()">Save completed workout to history</button><p class="mini">If you return to this date and day, your entries remain available.</p></div><p class="notice">Keep 1–3 reps in reserve on most working sets. Avoid movements that cause elbow pain.</p>';
}else if(view==='history'){
html='<h2>History & targets</h2><div class="card"><h3>Warm-up runs</h3><p class="muted">Initial recorded run: 2 miles in 14:50</p>'+((db.runs||[]).map(x=>'<p>'+escapeHTML(x.date)+' · '+escapeHTML(x.distance)+' miles · '+escapeHTML(x.time)+'</p>').join('')||'')+'</div><div class="card"><h3>Previous workout entries</h3><div style="overflow:auto"><table><tr><th>Date</th><th>Exercise</th><th>Weight</th><th>Reps</th><th>Sets</th></tr>'+db.logs.slice().reverse().map(l=>'<tr><td>'+escapeHTML(l.date)+'</td><td>'+escapeHTML(l.exercise)+'</td><td>'+escapeHTML(l.weight)+' lb</td><td>'+escapeHTML(l.reps)+'</td><td>'+escapeHTML(l.sets||'—')+'</td></tr>').join('')+'</table></div></div><div class="card"><h3>Next weight milestones</h3><table><tr><th>Exercise</th><th>Starting</th><th>Next target</th></tr>'+[['Chest press',85,95],['Leg curl',70,80],['Lat pulldown',110,120],['Seated cable row',110,120],['Triceps pushdown',35,40]].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+' lb</td><td>'+x[2]+' lb</td></tr>').join('')+'</table><p class="muted">These are personal progression milestones, not required standards.</p></div><div class="card"><h3>Warm-up run</h3><p>2 miles · 14:50 · 7:25/mile</p></div>';
}else{
html='<h2>Data backup</h2><div class="card"><p>Your records are stored locally in this browser, not automatically synced between devices. Export a backup regularly.</p><button class="primary" onclick="exportBackup()">Download JSON backup</button><p class="mini">Do not clear browser storage without exporting your workout data.</p></div>';
}
$('app').innerHTML=html;updateProgress()}
function finishWorkout(){const entries=getSession();let count=0;plan[day].ex.forEach(([exercise],i)=>{const e=entries[i];if(!e||!e.done)return;const id='session-'+sessionKey()+'-'+i;const row={id,date:sessionDate,day,exercise,weight:e.weight||0,reps:e.reps||'—',sets:e.sets||'—'};let idx=db.logs.findIndex(l=>l.id===id);if(idx>=0)db.logs[idx]=row;else db.logs.push(row);count++});if(entries.runDone||entries.runDistance||entries.runTime){db.runs=db.runs||[];const run={id:'run-'+sessionKey(),date:sessionDate,distance:entries.runDistance||'',time:entries.runTime||''};const ix=db.runs.findIndex(x=>x.id===run.id);if(ix>=0)db.runs[ix]=run;else db.runs.push(run)}persist();alert(count?count+' checked-off exercises saved to history.':'Run details saved. Check off exercises to save them to history.')}
function exportBackup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='gymsesh-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
persist();render();
</script></html>
